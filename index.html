<style>

<script>
window.addEventListener('error', function(e) {
  console.error('RunFront error:', e.message || e.error || e);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('RunFront async error:', e.reason);
});
if(typeof maplibregl==='undefined'||typeof supabase==='undefined'){
  document.body.innerHTML='<main style="min-height:100%;display:grid;place-items:center;padding:28px;background:#090909;color:#fff;font:16px/1.5 system-ui;text-align:center"><section style="max-width:520px"><h2 style="font-size:24px;margin-bottom:12px">RunFront could not start</h2><p style="color:#bbb">A required app library did not load. Check your internet connection, then reopen this page in Chrome. If this keeps happening, the CDN may be blocked or unavailable.</p><p style="margin-top:16px;color:#888;font-size:13px">Missing: '+(typeof maplibregl==='undefined'?'MapLibre ':'')+(typeof supabase==='undefined'?'Supabase':'')+'</p><button onclick="location.reload()" style="margin-top:20px;padding:12px 20px;border-radius:8px;background:#fff;color:#000;font-weight:700">Try again</button></section></main>';
  throw new Error('RunFront dependency failed to load');
}
const $=s=>document.querySelector(s),KM=111320,KY=110540,TC=['','#25F4EE','#3DA5FF','#7B8CFF','#C77DFF','#FF4F9A','#FE2C55','#FF8A00','#FFD60A'],TX=t=>[1,7,8].includes(t)?'#000':'#fff',LB=['','F','D','C','B','A','S','S+','SS'],MI=.621371;
const band=mi=>mi<=2?'Low tier':mi<=8?'Medium tier':'High tier';
const dist=(a,b)=>Math.hypot((b[0]-a[0])*Math.cos(a[1]*Math.PI/180)*KM,(b[1]-a[1])*KY);
let S={loops:[],pts:0,runs:[],tick:Date.now(),me:{name:'runner',bio:''},friends:[],msgs:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem('rf')))}catch(e){}
const save=()=>{try{localStorage.setItem('rf',JSON.stringify(S))}catch(e){}};
/* Tiers: anything under 8 mi is T1 (T2 only if the terrain is tough). 8+ mi climbs T3-T6. */
/* Tier list: low (F, D) up to 2 mi, medium (C, B, A) over 2 up to 8 mi, high (S, S+, SS) over 8 mi. Tough terrain moves a run up one tier inside its band. */
const tierOf=(km,ter=0)=>{const mi=km*MI;let t=mi<1?1:mi<=2?2:mi<4?3:mi<6?4:mi<=8?5:mi<13.1?6:mi<20?7:8;if(ter>=25)t=Math.min(mi<=2?2:mi<=8?5:8,t+1);return t},rate=t=>[0,1,2,5,12,30,100,250,600][t]||0;
const mi1=km=>(km*MI).toFixed(km*MI<10?2:1),paceMi=spk=>spk?fmtT(spk/MI):'–';
const dLabel=n=>n<25?'Easy':n<45?'Moderate':n<65?'Hard':'Brutal';
function turnsOf(p){const s=[];p.forEach(q=>{if(!s.length||dist(s[s.length-1],q)>=80)s.push(q)});const h=(a,b)=>Math.atan2((b[0]-a[0])*Math.cos(a[1]*Math.PI/180),b[1]-a[1])*180/Math.PI;let n=0;for(let i=2;i<s.length;i++){let d=Math.abs(h(s[i-1],s[i])-h(s[i-2],s[i-1]));if(d>180)d=360-d;if(d>60)n++}return n}
function scoreOf(km,gain,turns){const mi=Math.max(km*MI,.1),dp=Math.min(55,mi*2.1),cp=gain==null?0:Math.min(30,gain/mi/8),tp=Math.min(15,turns/mi*1.5);return{ter:cp+tp,score:Math.round(dp+cp+tp)}}
async function elevGain(p){const n=Math.min(100,p.length),ix=[];for(let i=0;i<n;i++)ix.push(Math.round(i*(p.length-1)/Math.max(1,n-1)));
 const la=ix.map(i=>p[i][1].toFixed(5)).join(','),lo=ix.map(i=>p[i][0].toFixed(5)).join(',');
 const ac=new AbortController(),to=setTimeout(()=>ac.abort(),7000),r=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+la+'&longitude='+lo,{signal:ac.signal});clearTimeout(to);const e=(await r.json()).elevation;if(!e||!e.length)throw 0;
 let ref=e[0],g=0;e.forEach(v=>{if(v-ref>2){g+=v-ref;ref=v}else if(ref-v>2)ref=v});return g*3.28084}
function rescore(d){const o=scoreOf(d.km,d.gain,d.turns);d.score=o.score;d.ter=o.ter;d.tier=tierOf(d.km,o.ter)}
const diffHTML=d=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Difficulty</span><span>${d.loading?'Reading terrain…':dLabel(d.score)+' · '+d.score}</span></div><div class="bar2" style="margin:0 0 14px"><u style="width:${d.score}%;background:#fff;transition:width .5s"></u></div>`;
const statsHTML=d=>`<div class="st"><span><b>${d.gain==null?(d.loading?'…':'–'):Math.round(d.gain)+' ft'}</b><small>climb</small></span><span><b>${d.turns}</b><small>turns</small></span><span><b>${rate(d.tier)}</b><small>pts/hr</small></span></div>`;
S.loops.forEach(l=>{l.tier=tierOf(l.km,l.ter||0)});
const fmtT=s=>{s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function cloudError(label, error) {
  console.error('RunFront ' + label + ':', error);

  toast(label + ' failed' + (message ? ': ' + String(message).slice(0, 100) : ''));

function queueCloudSync(delay=900) {
  if (!currentUser) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(() => syncToCloud().catch(e => cloudError('Cloud sync', e)), delay);
}
async function syncToCloud() {
  const user = currentUser;
  if (!user) return;
  const profile = {
    id: user.id,
    name: S.me.name || 'runner',
    bio: S.me.bio || '',
    pts: Number(S.pts) || 0
  };
  const pr = await sbClient.from('profiles').upsert(profile, { onConflict: 'id' });
  if (pr.error) throw pr.error;

  const loopRows = S.loops.map(l => ({
    id: String(l.id), user_id: user.id, name: l.name || 'Loop', path: l.p || [],
    km: Number(l.km) || 0, tier: Number(l.tier) || 1,
    gain: Number(l.gain) || 0, turns: Number(l.turns) || 0,
    score: Number(l.score) || 0, ter: Number(l.ter) || 0, claimed: !!l.claimed
  }));
  if (loopRows.length) {
    const lr = await sbClient.from('loops').upsert(loopRows, { onConflict: 'id' });
    if (lr.error) throw lr.error;
  }

  const runRows = S.runs.map(r => ({
    client_id: 'r' + String(r.t) + '-' + String(r.id),
    user_id: user.id, loop_id: String(r.id),
    sec: Number(r.sec) || 0, km: Number(r.km) || 0,
    created_at: new Date(Number(r.t) || Date.now()).toISOString()
  }));
  if (runRows.length) {
    const rr = await sbClient.from('runs').upsert(runRows, { onConflict: 'user_id,client_id' });
    if (rr.error) throw rr.error;
  }
}

async function signInWithGoogle() {
  try {
    const redirectTo = location.origin + location.pathname;
    const { error } = await sbClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo }
    });
    if (error) cloudError('Google sign-in', error);
  } catch (e) { cloudError('Google sign-in', e); }
}

async function signOut() {
  try {
    clearTimeout(cloudSyncTimer);
    if (currentUser) await syncToCloud();
    const { error } = await sbClient.auth.signOut();
    if (error) throw error;
    currentUser = null;
    cloudReady = false;
    save();
    goP('me');
    toast('Signed out');
  } catch (e) { cloudError('Sign out', e); }
}

async function loadFromCloud() {
  if (cloudLoadPromise) return cloudLoadPromise;
  cloudLoadPromise = (async () => {
    const { data: { user }, error: userError } = await sbClient.auth.getUser();
    if (userError) throw userError;
    currentUser = user;
    if (!user) return;

    const [profileRes, loopsRes, runsRes] = await Promise.all([
      sbClient.from('profiles').select('*').eq('id', user.id).maybeSingle(),
      sbClient.from('loops').select('*').eq('user_id', user.id),
      sbClient.from('runs').select('*').eq('user_id', user.id)
    ]);
    if (profileRes.error) throw profileRes.error;
    if (loopsRes.error) throw loopsRes.error;
    if (runsRes.error) throw runsRes.error;

    const remoteLoops = (loopsRes.data || []).map(l => ({
      id: String(l.id), name: l.name || 'Loop', p: l.path || [], km: Number(l.km) || 0,
      tier: Number(l.tier) || 1, gain: l.gain == null ? null : Number(l.gain),
      turns: Number(l.turns) || 0, score: Number(l.score) || 0,
      ter: Number(l.ter) || 0, claimed: !!l.claimed
    })).filter(l => Array.isArray(l.p) && l.p.length >= 2);

    const mergedLoops = new Map(S.loops.map(l => [String(l.id), l]));
    remoteLoops.forEach(l => mergedLoops.set(String(l.id), l));
    S.loops = [...mergedLoops.values()];

    const remoteRuns = (runsRes.data || []).map(r => ({
      id: String(r.loop_id), sec: Number(r.sec) || 0, km: Number(r.km) || 0,
      t: new Date(r.created_at).getTime() || Date.now()
    }));
    const runKey = r => String(r.id) + ':' + String(r.t);
    const mergedRuns = new Map(S.runs.map(r => [runKey(r), r]));
    remoteRuns.forEach(r => mergedRuns.set(runKey(r), r));
    S.runs = [...mergedRuns.values()];

    if (profileRes.data) {
      S.me = { name: profileRes.data.name || S.me.name || 'runner', bio: profileRes.data.bio || '' };
      S.pts = Number(profileRes.data.pts) || Number(S.pts) || 0;
    } else {
      const name = user.user_metadata?.full_name || user.email?.split('@')[0] || S.me.name || 'runner';
      S.me.name = S.me.name && S.me.name !== 'runner' ? S.me.name : name;
    }
    save();
    cloudReady = true;
    await syncToCloud();
    refresh();
    accrue();
    if (document.querySelector('.tab.on')?.dataset.p === 'me') goP('me');
    toast('Cloud sync connected');
  })();
  try { return await cloudLoadPromise; }
  finally { cloudLoadPromise = null; }
}

 if(id==='sv'){if(S.loops.filter(l=>!l.claimed).length>=3)return toast('3 unfinished routes max · finish or delete one first');S.loops.push({id:'l'+Date.now(),name:'Loop '+(S.loops.length+1),p:draft.p,km:draft.km,tier:draft.tier,gain:draft.gain,turns:draft.turns,score:draft.score,ter:draft.ter,claimed:false});sel=null;draft=null;mode=null;save();queueCloudSync();card();refresh();toast('Saved to Runs')}
 if(id==='dl'){const deletedId=String(sel);S.loops=S.loops.filter(l=>String(l.id)!==deletedId);sel=null;mode=null;save();if(currentUser)sbClient.from('loops').delete().eq('id',deletedId).eq('user_id',currentUser.id).then(({error})=>{if(error)cloudError('Route delete',error)});card();refresh();accrue()}
 if(id==='dr'){const T=draft||S.loops.find(l=>l.id===sel);if(!T)return;let d=T.p[0];if(here){let m=1e12;T.p.forEach(q=>{const x=dist(here,q);if(x<m){m=x;d=q}})}else{watch();toast('Using the route start')}window.open('https://www.google.com/maps/dir/?api=1&destination='+d[1].toFixed(6)+','+d[0].toFixed(6),'_blank')}
 if(id==='go')startHere();if(id==='sm')start(true);if(id==='sp')stop(true)});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.b');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,p=document.createElement('span');p.className='rp';p.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.style.position='relative';b.style.overflow='hidden';b.appendChild(p);setTimeout(()=>p.remove(),600)});

function start(sim){const L=S.loops.find(l=>l.id===sel);if(!L||run)return;if(!sim&&!here){watch();return toast('Waiting for GPS')}
 run={L,t0:Date.now(),d:0,last:null,v:new Set(),sim,ss:0};mode='run';card();map.flyTo({center:L.p[0],zoom:16.5,duration:900});
 if(sim){let i=0;run.iv=setInterval(()=>{const a=L.p[Math.min(i,L.p.length-1)];if(i>0)run.ss+=dist(L.p[i-1],a)/3;put({lng:a[0],lat:a[1]});onFix(a);i++;if(i>L.p.length+1)stop(false)},45)}
 run.ui=setInterval(upd,500)}
const secs=()=>run.sim?run.ss:(Date.now()-run.t0)/1000;
function upd(){if(!run||!$('#rt'))return;const s=secs(),km=run.d/1000;$('#rt').textContent=fmtT(s);$('#rk').textContent=(km*MI).toFixed(2);$('#rp').textContent=km>.05?paceMi(s/km):'–'}
function onFix(q){if(!run)return;if(run.last)run.d+=dist(run.last,q);run.last=q;run.L.p.forEach((p,i)=>{if(dist(q,p)<35)run.v.add(i)});upd();
 if(run.v.size>=run.L.p.length*.9&&run.d>=run.L.km*850&&dist(q,run.L.p[0])<45)stop(false)}
function stop(manual){if(!run)return;const r=run;run=null;clearInterval(r.ui);clearInterval(r.iv);const s=r.sim?r.ss:(Date.now()-r.t0)/1000,km=r.d/1000,done=r.v.size>=r.L.p.length*.9&&r.d>=r.L.km*850;
 mode='loop';card();
 if(!done){toast('Loop not closed');return}
 accrue();S.runs.push({id:r.L.id,sec:Math.round(s),km:+km.toFixed(2),t:Date.now()});const L=S.loops.find(l=>l.id==r.L.id);const was=L.claimed;L.claimed=true;save();queueCloudSync();accrue();card();refresh();toast(was?'✓ '+fmtT(s)+' · '+(km*MI).toFixed(2)+' mi':'Mining started')}

const pg=$('#pg');let rk='g';
const RUNSVG='<svg viewBox="0 0 48 48"><rect width="48" height="48" fill="#2a2b36"/><circle cx="28" cy="13" r="3.2" fill="#fff"/><g stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M26 18 L22 28"/><path d="M25 20 L31 25"/><path d="M25 20 L17 22"/><path d="M22 28 L28 34 L27 41"/><path d="M22 28 L16 35 L10 33"/></g></svg>';
function thumb(p,col){let a=1e9,b=-1e9,c=1e9,d=-1e9;p.forEach(q=>{a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[1]);d=Math.max(d,q[1])});const k=Math.cos((c+d)/2*Math.PI/180),m=Math.max((b-a)*k,d-c)||1e-9,st=Math.max(1,Math.floor(p.length/80));
 const pp=p.filter((_,i)=>i%st===0).map(q=>(10+(q[0]-a)*k/m*80).toFixed(1)+','+(90-(q[1]-c)/m*80).toFixed(1)).join(' ');return`<svg viewBox="0 0 100 100"><polyline points="${pp}" fill="none" stroke="#25F4EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.5 -1.5)"/><polyline points="${pp}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const chip=t=>`<span class="t" style="background:${TC[t]};color:${TX(t)}">${LB[t]}</span>`;
const PGS={
 ranks(){return rk==='g'?`<div class="rw"><i>1</i><div class="av s">${RUNSVG}</div><div class="nm"><b>You</b><br><small>${Math.floor(S.pts).toLocaleString()} pts</small></div></div><div class="empty">Other runners show up once sign-in is live</div>`:'<div class="empty">Friends will show up here</div>'},
 runs(){const a=[...S.runs].sort((x,y)=>y.t-x.t).slice(0,60);return a.length?a.map(r=>{const l=S.loops.find(l=>l.id===r.id)||{name:'Loop',tier:1,p:[[0,0],[1,0]]};return`<div class="rw"><div class="th">${thumb(l.p,TC[l.tier])}</div><div class="nm"><b>${l.name}</b> ${chip(l.tier)}<br><small>${new Date(r.t).toLocaleDateString()}</small></div><div style="text-align:right"><b>${(r.km*MI).toFixed(2)} mi</b><br><small>${fmtT(r.sec)} · ${paceMi(r.sec/r.km)}/mi</small></div></div>`}).join(''):'<div class="empty">No runs yet. Draw a route with + and run it.</div>'},
 me(){const km=S.runs.reduce((a,r)=>a+r.km,0),bp=S.runs.filter(r=>r.km>=1).map(r=>r.sec/r.km).sort((a,b)=>a-b)[0],mt=Math.max(0,...S.loops.filter(l=>l.claimed).map(l=>l.tier));
  return`<div class="pf"><div class="av">${RUNSVG}</div><h2>@${esc(S.me.name)}</h2><small>${mt?'Top tier '+LB[mt]:'No tier yet'} · best ${bp?paceMi(bp)+'/mi':'–'}</small></div><div class="pst"><div><b>${S.loops.length}</b><small>Routes</small></div><div><b>${S.runs.length}</b><small>Runs</small></div><div><b>${(km*MI).toFixed(1)}</b><small>Miles</small></div></div>`+(S.loops.length?`<div class="g3">${S.loops.map(l=>`<div class="tl" data-loop="${l.id}">${thumb(l.p,TC[l.tier])}${chip(l.tier)}<small>${(l.km*MI).toFixed(1)} mi</small></div>`).join('')}</div>`:'<div class="empty">Your routes show up here</div>')}};
function goP(p){if(dwOn&&p!=='map')setDraw(false);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='map'){pg.hidden=true;return}
 const hd=p==='ranks'?`<button data-rk="g" class="${rk==='g'?'on':''}">Global</button><button data-rk="f" class="${rk==='f'?'on':''}">Friends</button>`:`<b>${p==='runs'?'Runs':'@runner'}</b>`;pg.hidden=false;pg.innerHTML=`<div class="ph">${hd}</div>`+PGS[p]();pg.scrollTop=0}
document.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)return goP(b.dataset.p);const k=e.target.closest('[data-rk]');if(k){rk=k.dataset.rk;return goP('ranks')}
 const t=e.target.closest('[data-loop]');if(t){const L=S.loops.find(l=>l.id===t.dataset.loop);if(!L)return;sel=L.id;mode='loop';goP('map');card();refresh();{const xs=L.p.map(q=>q[0]),ys=L.p.map(q=>q[1]);map.fitBounds([[Math.min(...xs),Math.min(...ys)],[Math.max(...xs),Math.max(...ys)]],{padding:{top:90,bottom:300,left:40,right:80},duration:800,maxZoom:17})}}});

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let fe=false,ch=null;
const msgLine=m=>`<div class="ln"><b>${esc(S.me.name)}:</b> ${esc(m.x)} <small>${new Date(m.t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</small></div>`;
function buddyWin(){return`<div class="win"><div class="wt"><span>Buddy List</span><button data-fe>${fe?'Done':'Edit'}</button></div><div class="wb"><div class="grp">▾ Buddies (${S.friends.length})</div>${S.friends.map(f=>{const m=(S.msgs[f.id]||[]).slice(-1)[0];return`<div class="bd" data-chat="${f.id}"><div class="ini">${esc(f.name[0].toUpperCase())}</div><div class="nm"><b>${esc(f.name)}</b><br><small>${m?esc(m.x).slice(0,40):'Say hi'}</small></div>${fe?`<button class="x" data-del="${f.id}">✕</button>`:''}</div>`}).join('')||'<div class="empty" style="padding:18px">No buddies yet</div>'}<div class="add"><input id="nf" placeholder="Add a screen name" maxlength="20"><button class="btn" data-add style="height:34px;flex:none;padding:0 14px">Add</button></div></div></div>`}
const meOld=PGS.me;
PGS.me=function(){
  const o=meOld(),i=o.indexOf('<div class="pst">');
  const authBtn = currentUser
    ? `<button class="btn g" onclick="signOut()" style="height:36px;margin-top:8px">Sign out</button>`
    : `<button class="btn" onclick="signInWithGoogle()" style="height:36px;margin-top:8px">Sign in with Google</button>`;
  return o.slice(0,i)
    .replace('@runner',esc(S.me.name))
    .replace('</small></div>','</small><p class="bio">'+(S.me.bio?esc(S.me.bio):'<small>No bio yet</small>')+'</p><button class="btn g" data-edit style="height:36px;margin-top:10px">Edit profile</button>'+authBtn+'</div>')
    +o.slice(i)+buddyWin();
};
PGS.edit=()=>`<div class="win"><div class="wt"><span>Edit profile</span></div><div class="wb" style="padding:14px"><small>Screen name</small><input id="en" value="${esc(S.me.name)}" maxlength="20"><small>Bio</small><textarea id="eb" maxlength="160" rows="4">${esc(S.me.bio)}</textarea><div class="row" style="margin-top:6px"><button class="btn g" data-p="me">Cancel</button><button class="btn" data-saveprof>Save</button></div></div></div>`;
PGS.chat=function(){const f=S.friends.find(x=>x.id===ch);if(!f)return PGS.me();return`<div class="chat"><div class="win"><div class="wt"><span>${esc(f.name)} · Instant Message</span><button data-p="me">✕</button></div><div class="wb cb"><div id="log"><div class="sys">Messages save on this device. ${esc(f.name)} gets them once sign-in goes live.</div>${(S.msgs[ch]||[]).map(msgLine).join('')}</div><div class="snd"><input id="mi" placeholder="Type a message" maxlength="400" autocomplete="off"><button class="btn" data-send style="height:40px;flex:none;padding:0 16px">Send</button></div></div></div></div>`};
function goP(p){if(dwOn&&p!=='map')setDraw(false);const tp=p==='chat'||p==='edit'?'me':p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===tp));if(p==='map'){pg.hidden=true;return}
 const hd=p==='chat'?'':p==='ranks'?`<button data-rk="g" class="${rk==='g'?'on':''}">Global</button><button data-rk="f" class="${rk==='f'?'on':''}">Friends</button>`:`<b>${p==='runs'?'Runs':p==='edit'?'Edit profile':esc(S.me.name)}</b>`;pg.hidden=false;pg.innerHTML=(hd?`<div class="ph">${hd}</div>`:'')+PGS[p]();pg.scrollTop=0}
function send(){const i=$('#mi'),x=i.value.trim();if(!x||!ch)return;const m={x,t:Date.now()};(S.msgs[ch]=S.msgs[ch]||[]).push(m);save();const l=$('#log');l.insertAdjacentHTML('beforeend',msgLine(m));l.scrollTop=l.scrollHeight;i.value='';i.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi')send()});
document.addEventListener('click',e=>{const q=a=>e.target.closest(a);
 if(q('[data-edit]'))return goP('edit');
 if(q('[data-saveprof]')){S.me.name=$('#en').value.trim()||'runner';S.me.bio=$('#eb').value.trim();save();queueCloudSync(100);toast('Profile saved');return goP('me')}
 if(q('[data-fe]')){fe=!fe;return goP('me')}
 if(q('[data-add]')){const n=$('#nf').value.trim();if(!n)return;if(S.friends.some(f=>f.name.toLowerCase()===n.toLowerCase()))return toast('Already a buddy');S.friends.push({id:'f'+Date.now(),name:n});save();return goP('me')}
 const d=q('[data-del]');if(d){S.friends=S.friends.filter(f=>f.id!==d.dataset.del);delete S.msgs[d.dataset.del];save();return goP('me')}
 const c=q('[data-chat]');if(c){ch=c.dataset.chat;goP('chat');const l=$('#log');if(l)l.scrollTop=l.scrollHeight;return}
 if(q('[data-send]'))return send()});

function mapThumb(l,done,W=480,H=130,fw=300,fh=84){let a=1e9,b=-1e9,c=1e9,d=-1e9;l.p.forEach(q=>{a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[1]);d=Math.max(d,q[1])});
 const wx=(o,z)=>(o+180)/360*256*2**z,wy=(t,z)=>(1-Math.log(Math.tan(t*Math.PI/180)+1/Math.cos(t*Math.PI/180))/Math.PI)/2*256*2**z;
 let z=17;for(;z>10;z--)if(wx(b,z)-wx(a,z)<=fw&&wy(c,z)-wy(d,z)<=fh)break;
 const cx=(wx(a,z)+wx(b,z))/2-W/2,cy=(wy(c,z)+wy(d,z))/2-H/2,n=2**z;let im='';
 for(let tx=Math.floor(cx/256);tx<=Math.floor((cx+W)/256);tx++)for(let ty=Math.floor(cy/256);ty<=Math.floor((cy+H)/256);ty++){if(ty<0||ty>=n)continue;const X=((tx%n)+n)%n;im+=`<img loading="lazy" alt="" src="https://${'abc'[(X+ty)%3]}.tile.openstreetmap.org/${z}/${X}/${ty}.png" style="left:${Math.round(tx*256-cx)}px;top:${Math.round(ty*256-cy)}px">`}
 const st=Math.max(1,Math.floor(l.p.length/120)),pp=l.p.filter((_,i)=>i%st===0).map(q=>(wx(q[0],z)-cx).toFixed(1)+','+(wy(q[1],z)-cy).toFixed(1)).join(' ');
 return`<div class="mt${done?' dn':''}" style="height:${H}px"><div class="stg" style="width:${W}px;height:${H}px;margin-left:-${W/2}px">${im}<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline class="mo" points="${pp}"/><polyline class="mc" points="${pp}"/></svg></div>${done?'<b class="ck">✓</b>':''}</div>`}
const oldRuns=PGS.runs;
PGS.runs=function(){if(!S.loops.length)return'<div class="empty">No routes yet. Tap the pencil on the map to sketch one.</div>';
 const cards=[...S.loops].sort((x,y)=>y.id.slice(1)-x.id.slice(1)).map(l=>{const rs=S.runs.filter(r=>r.id===l.id),best=rs.map(r=>r.sec/r.km).sort((p,q)=>p-q)[0];
  return`<div class="rc${l.claimed?' dn':''}" style="--c:${TC[l.tier]}" data-loop="${l.id}">${mapThumb(l,l.claimed)}<div class="ri"><div class="nm"><b>${esc(l.name)}</b><br><small>${(l.km*MI).toFixed(2)} mi · ${l.claimed?rs.length+(rs.length===1?' run':' runs')+' · best '+paceMi(best)+'/mi':'Not run yet · finish it to earn points'}</small></div>${chip(l.tier)}</div></div>`}).join('');
 return cards+(S.runs.length?'<div class="hdv">History</div>'+oldRuns():'')};

function goDir(){const T=draft||S.loops.find(l=>l.id===sel);if(!T)return;let d=T.p[0];if(here){let m=1e12;T.p.forEach(q=>{const x=dist(here,q);if(x<m){m=x;d=q}})}else{watch();toast('Using the route start')}window.open('https://www.google.com/maps/dir/?api=1&destination='+d[1].toFixed(6)+','+d[0].toFixed(6),'_blank')}
function startHere(){const L=S.loops.find(l=>l.id===sel);if(!L)return;if(!here){watch();return toast('Waiting for GPS')}let m=1e12;L.p.forEach(q=>{m=Math.min(m,dist(here,q))});if(m>150)return toast("You're "+(m/1000*MI).toFixed(1)+" mi from this loop · tap Directions");start(false)}
function qaShow(){const T=draft||S.loops.find(l=>l.id===sel),q=$('#qa'),un=S.loops.filter(l=>!l.claimed).length;
 q.innerHTML=`<div class="qh">${T?`<b>${esc(T.name||'New route')}</b>${mi1(T.km)} mi · ${LB[T.tier]}`:'<b>No run highlighted</b>Tap a saved route first'}</div><button class="btn g" data-q="dr" ${T?'':'disabled'}>Directions</button><button class="btn" data-q="go" ${sel&&!draft?'':'disabled'}>Start run</button><small style="display:block;text-align:center;margin-top:10px">${un}/3 unfinished routes</small>`;
 q.classList.toggle('on');$('#dw').classList.toggle('on',q.classList.contains('on'))}
$('#dw').onclick=()=>{if(run)return toast('Run in progress');goP('map');qaShow()};
$('#qa').onclick=e=>{const b=e.target.closest('[data-q]');if(!b||b.disabled)return;$('#qa').classList.remove('on');$('#dw').classList.remove('on');b.dataset.q==='dr'?goDir():startHere()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#qa,#dw')){$('#qa').classList.remove('on');$('#dw').classList.remove('on')}});
const runs2=PGS.runs;PGS.runs=function(){const n=S.loops.filter(l=>!l.claimed).length;return(S.loops.length?`<div class="hdv">Unfinished routes ${n}/3</div>`:'')+runs2()};
</script></body></html>
